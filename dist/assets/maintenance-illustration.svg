<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
<title id="title">BEU Exam Dost maintenance illustration</title>
<desc id="desc">A detailed three-dimensional laptop with a clear maintenance gear and crossed tools on its screen, surrounded by a safety helmet, traffic cone, books, coffee cup and green plants.</desc>
