<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" fill="none" role="img" aria-labelledby="title desc">
<title id="title">BEU Exam Dost maintenance illustration</title>
<desc id="desc">A laptop displaying the BEU Exam Dost emblem with tools, a safety helmet, traffic cone and green plants.</desc>
<defs>
 <linearGradient id="screenFrame" x1="230" y1="92" x2="590" y2="386" gradientUnits="userSpaceOnUse"><stop stop-color="#65758E"/><stop offset=".55" stop-color="#3F4B61"/><stop offset="1" stop-color="#253447"/></linearGradient>
 <linearGradient id="screen" x1="250" y1="112" x2="568" y2="355" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset="1" stop-color="#E7EEF2"/></linearGradient>
 <linearGradient id="deck" x1="170" y1="390" x2="635" y2="510" gradientUnits="userSpaceOnUse"><stop stop-color="#D9E2EB"/><stop offset=".48" stop-color="#AABACB"/><stop offset="1" stop-color="#65778D"/></linearGradient>
 <linearGradient id="green" x1="100" y1="330" x2="220" y2="490" gradientUnits="userSpaceOnUse"><stop stop-color="#43C576"/><stop offset="1" stop-color="#087743"/></linearGradient>
 <linearGradient id="mint" x1="0" y1="100" x2="760" y2="590" gradientUnits="userSpaceOnUse"><stop stop-color="#E8F9F0"/><stop offset="1" stop-color="#D5F1E3"/></linearGradient>
 <linearGradient id="helmet" x1="100" y1="400" x2="250" y2="525" gradientUnits="userSpaceOnUse"><stop stop-color="#FFE47B"/><stop offset=".55" stop-color="#FFC72C"/><stop offset="1" stop-color="#E99B12"/></linearGradient>
 <linearGradient id="cone" x1="580" y1="380" x2="680" y2="535" gradientUnits="userSpaceOnUse"><stop stop-color="#FF9B42"/><stop offset="1" stop-color="#E75A13"/></linearGradient>
 <filter id="shadow" x="70" y="65" width="650" height="515" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="14"/></filter>
 <filter id="softShadow" x="100" y="300" width="600" height="270" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<ellipse cx="382" cy="510" rx="315" ry="45" fill="#A8DAC0" opacity=".28" filter="url(#softShadow)"/>
